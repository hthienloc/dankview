name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify VERSION matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::VERSION is '${version}' but the tag is '${TAG}'"; exit 1
          fi

      - name: Generate changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous_tag=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "## What's Changed"
            echo
            if [ -z "$previous_tag" ]; then
              git log --pretty=format:'- %s (%h)' "${TAG}"
            else
              git log --pretty=format:'- %s (%h)' "${previous_tag}..${TAG}"
              echo
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${previous_tag}...${TAG}"
            fi
            echo
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
